<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="IMF — расписание ММФ" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>IMF — Расписание</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <a href="#feed" class="skip-link">Перейти к расписанию</a>
    <div id="app">
      <header class="appbar">
        <button type="button" class="wordmark" id="wordmark" aria-label="IMF — расписание">
          IMF
        </button>
        <div class="appbar-actions">
          <span id="netDot" class="net-dot" hidden></span>
          <button type="button" class="group-chip" id="groupChip" aria-label="Выбрать группу">
            <span class="group-chip-label" id="groupChipLabel">Группа</span>
            <svg class="chip-caret" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="m6 9 6 6 6-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="searchBtn" aria-label="Найти пару">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle
                cx="11"
                cy="11"
                r="7"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="m20 20-3.5-3.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="settingsBtn" aria-label="Настройки">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 7h9M17.5 7H20M4 17h3M11.5 17H20"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="15" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8" />
              <circle cx="9" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8" />
            </svg>
            <span id="changesDot" class="badge-dot" hidden></span>
          </button>
          <button type="button" class="icon-btn" id="themeToggle" aria-label="Переключить тему">
            <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
              <circle
                cx="12"
                cy="12"
                r="4"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="installBtn" aria-label="Установить приложение" hidden>
            <svg id="installIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 17.25V21h3.5L12 18.25l4.5 2.75H21v-3.75L12 15l-4.5 2.25zM19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10L7 11l1.41-1.41L11 10.59V17h2v-5.59l2.59-2.58L13 11l1.41 1.41L17 8.59V17h2V5c0-1.1-.9-2-2-2z"
              />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="shareBtn" aria-label="Поделиться расписанием">
            <svg id="shareIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.87 1.64 0 3.05-1.12 3.21-2.74-.01-.16-.07-.31-.16-.45-.23-.34-.56-.6-.92-.73-.53-.2-1.1-.28-1.71-.28-.64 0-1.27.11-1.87.34-.67.27-.96.9-.72 1.46-.26.61-.44 1.24-.44 1.84 0 1.6 1.06 2.94 2.53 3.39-1.14.14-2.29.23-3.45.24-.57 0-1.14-.02-1.69-.06l-.03-.01.01-.01-.01-.01zM16.5 7c-.16 0-.31.01-.47.05-.5.06-.98.26-1.38.58-.36.3-.59.74-.7 1.17-.26.86-.24 1.77-.08 2.62.15.84.49 1.63.94 2.29l-.05-.01-.03-.02q-.115.28-.21.56q-.09.26-.17.53l-.01-.01-.02-.02-.05-.06-.01-.01l-.04-.06q-.045.09-.08.19l-.01-.01c-.03.07-.05.14-.08.21q-.055.15-.1.3l-.01-.01-.01-.01l-.03-.04q-.03.07-.05.15l-.01-.01-.03-.04q-.03.06-.05.14-.01.03-.03.06l-.01-.01-.04-.05c-.015.02-.02.05-.03.07l-.01-.01-.04-.04c-.03.06-.05.13-.07.2-.015.02-.02.05-.02.07l-.01-.01-.02-.03-.01-.02c-.02.06-.03.13-.04.19-.005.02-.01.05-.01.07s-.01.04-.02.07q-.03.1-.05.2l-.01-.01-.01-.02-.04-.05-.01-.01-.03-.04-.01-.02-.01-.01-.04-.05-.01-.01c-.03.05-.06.1-.09.16l-.01-.01c-.025.05-.04.1-.06.16l-.01-.01c-.02.04-.04.09-.06.13-.01.02-.01.04-.02.06-.025.05-.05.1-.07.16l-.01-.01-.02-.03c-.03.04-.05.08-.08.12-.015.02-.02.05-.03.07l-.01-.01-.01-.02-.01-.02c-.025.04-.05.07-.07.11-.01.01-.01.02-.02.03-.01.01-.02.03-.03.04l-.01-.01-.03-.04-.01-.01-.03-.04-.01-.01c-.02.03-.03.06-.04.09l-.01-.01-.01-.01c-.03.04-.06.08-.09.12-.015.02-.02.05-.03.07l-.01-.01-.02-.03-.01-.02-.03-.04l-.01-.01c-.025.04-.05.07-.07.11-.015.02-.02.05-.03.07l-.01-.01-.02-.03-.01-.02c-.03.03-.05.07-.08.1-.01.01-.01.02-.02.03-.01.01-.01.02-.02.03l-.01-.01-.01-.02-.02-.04c-.015.02-.03.05-.04.07-.01.01-.01.02-.02.03-.015.02-.03.03-.04.05l-.01-.01c-.025.03-.04.07-.05.1q-.03.1-.05.2l-.01-.01c-.015.03-.03.05-.04.08-.01.02-.01.04-.02.06l-.01-.01-.01-.02-.02-.04-.01-.01-.01-.02-.02-.04c-.01-.02-.02-.05-.03-.07l-.01-.01-.02-.04-.01-.01-.01-.02-.01-.02-.02-.04c-.01-.02-.01-.04-.02-.06l-.01-.01c-.025.03-.05.07-.07.1-.015.02-.03.04-.04.07-.015.02-.02.05-.03.07l-.01-.01-.02-.04-.01-.02-.03-.05-.01-.01-.02-.04-.01-.02-.03-.05-.01-.01c-.01-.02-.02-.04-.03-.06l-.01-.01-.01-.01c-.015.02-.02.05-.03.07l-.01-.01-.02-.04-.01-.01-.01-.02-.01-.02-.01-.02-.01-.01-.01-.01c-.015.01-.03.03-.04.05-.015.01-.02.03-.04.05-.01.01-.01.02-.01.02-.02.04-.03.07-.04.08-.015.02-.02.04-.03.06l-.01-.01c-.01.01-.01.02-.02.04-.02.03-.04.06-.06.09-.015.02-.02.04-.03.06l-.01-.01-.01-.02-.01-.02-.01-.02c-.015.03-.02.06-.03.09-.015.02-.02.05-.03.07-.01.01-.01.02-.02.03l-.01-.01c-.03.04-.05.08-.07.12-.015.01-.02.03-.03.05l-.01-.01-.02-.04-.01-.01-.01-.02-.01-.02-.01-.02-.01-.01c-.015.02-.03.04-.04.06-.015.02-.02.04-.03.06-.01.01-.01.02-.02.03l-.01-.01c-.01.02-.02.03-.03.05-.015.01-.02.03-.03.05-.01.01-.01.02-.01.02l-.01-.01c-.015.02-.02.04-.03.06l-.01-.01-.01-.01-.01-.02-.01-.02c-.015.03-.02.06-.03.08-.015.02-.02.04-.03.07-.01.01-.01.02-.01.02-.01.01-.01.02-.01.02c-.015.03-.03.05-.04.08-.015.01-.01.02-.02.03-.015.02-.03.03-.04.05-.01.01-.01.02-.02.03l-.01-.01-.01-.02-.01-.02c-.025.04-.04.07-.05.11-.015.01-.02.03-.03.05-.015.02-.03.04-.04.06-.015.01-.02.03-.03.05-.015.01-.02.02-.02.03-.015.01-.01.01-.02.03-.015.02-.02.03-.03.05-.015.01-.01.02-.02.03-.01.01-.01.01-.01.02-.015.02-.02.04-.03.06-.01.01-.01.01-.02.02z"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- QR share modal -->
      <div id="qrModal" class="qr-modal" hidden>
        <div class="qr-modal-backdrop" id="qrModalClose"></div>
        <div class="qr-modal-card">
          <div class="qr-modal-header">
            <h2>Поделиться расписанием</h2>
            <button type="button" class="icon-btn" id="qrModalCloseBtn" aria-label="Закрыть">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div class="qr-modal-body">
            <div class="qr-card">
              <img id="qrCodeImage" class="qr-image" alt="QR-код расписания"/>
              <p class="qr-hint">Отсканируйте камерой — откроется расписание</p>
            </div>
            <div class="qr-link">
              <label class="qr-link-label">Ссылка на расписание:</label>
              <div class="qr-link-input-wrapper">
                <input id="qrLinkInput" type="text" readonly class="qr-link-input" spellcheck="false"/>
                <button type="button" class="qr-link-copy" id="qrCopyBtn" aria-label="Скопировать ссылку">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm-5 8H4v6h10.33L13 17.33V9zM19 7H9v3h10V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span class="copy-toast" id="qrCopyToast" hidden>Скопировано</span>
                </button>
              </div>
            </div>
            <div class="qr-ios-hint" id="qrIosHint" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true" class="qr-ios-icon">
                <path d="M20.98 4.97c.41-.81.65-1.79.65-2.77C21.63 2 20.21 1 19 1S16.37 2 16.37 2c-.42 1.61-.84 3.22-.98 4.85-1.07-.67-2.37-1.08-3.79-1.08-2.09 0-3.86 1.35-4.39 3.39-.38 1.47-.29 2.97.31 4.38 1.05 2.47 2.96 4.13 5.27 4.72v4.11c0 .55-.45 1-1 1H6c-.55 0-1-.45-1-1V7c0-.55.45-1 1-1h3c.55 0 1-.45 1-1 0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14c0 .55.45 1 1 1h18c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1zM9 7H6c-.55 0-1 .45-1 1v1c0 .55.45 1 1 1h3c.55 0 1-.45 1-1 0-.55-.45-1-1-1zm5 14H6c-.55 0-1 .45-1 1v1c0 .55.45 1 1 1h14c.55 0 1-.45 1-1v-1c0-.55-.45-1-1-1h-9c-.55 0-1-.45-1-1v-1c0-.55-.45-1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <p class="qr-ios-text">На iPhone: нажмите «Поделиться» в браузере → «На экран «Домой»»</p>
            </div>
          </div>
          <div class="qr-modal-footer">
            <button type="button" class="btn btn-primary" id="qrModalDoneBtn">Готово</button>
          </div>
        </div>
      </div>

      <div id="statusBanner" class="status-host"></div>

      <main id="feed" class="feed">
        <error-boundary message="Расписание недоступно">
          <div id="dayStrip" class="day-strip" role="tablist" aria-label="День недели"></div>
          <div id="feedBody" class="feed-body"></div>
        </error-boundary>
      </main>

      <div id="sheetRoot"></div>

      <div
        id="searchOverlay"
        class="search-overlay"
        hidden
        role="dialog"
        aria-modal="true"
        aria-label="Поиск по расписанию"
      >
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle
              cx="11"
              cy="11"
              r="7"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="m20 20-3.5-3.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <label class="sr-only" for="searchInput">Поиск по расписанию</label>
          <input
            id="searchInput"
            type="search"
            enterkeyhint="search"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Предмет, преподаватель, аудитория…"
          />
          <button type="button" class="icon-btn" id="searchClose" aria-label="Закрыть поиск">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6 6 18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <div id="searchResults" class="search-results" aria-live="polite"></div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="src/view/errorBoundary.js"></script>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
